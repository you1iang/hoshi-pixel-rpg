<title>星喰みの夜 — コマンドRPG</title>
<style>
:root{--bg:#0b1022;--panel:#171e3a;--panel2:#20294b;--line:#6574a6;--gold:#f7d77a;--white:#f4f5ff;--muted:#b5bfdc;--red:#ff8585;--blue:#8ad8ff;--green:#9df0bc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#29365e 0,#10152c 45%,#080b18 100%);color:var(--white);font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;min-height:100vh;padding:12px}button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid var(--gold)}.shell{max-width:760px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 12px}.brand{font-weight:900;letter-spacing:.06em;color:var(--gold);font-size:clamp(17px,4.8vw,25px);text-shadow:2px 2px #563d67}.chip{font-size:11px;border:1px solid #7181b1;border-radius:4px;padding:5px 7px;color:var(--muted)}.screen{border:3px solid #8493c7;background:#10162c;box-shadow:0 0 0 3px #070a16,0 8px 25px #0008;border-radius:7px;overflow:hidden}.scene{position:relative;min-height:180px;background:linear-gradient(#131b3c,#293d64 68%,#182644);overflow:hidden;display:flex;align-items:center;justify-content:center}.scene:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1px),radial-gradient(#9ebdff 1px,transparent 1px);background-size:37px 31px,61px 47px;background-position:0 0,18px 11px;opacity:.55}.moon{position:absolute;right:12%;top:18px;width:36px;height:36px;border-radius:50%;background:#f5e6b0;box-shadow:0 0 28px #ffe5a177}.mountain{position:absolute;bottom:0;width:100%;height:72px;background:#17233f;clip-path:polygon(0 75%,13% 36%,22% 68%,38% 14%,52% 63%,70% 27%,83% 67%,94% 40%,100% 60%,100% 100%,0 100%)}.scene-art{position:relative;z-index:1;font-size:clamp(52px,14vw,88px);filter:drop-shadow(4px 5px 0 #080b18);image-rendering:pixelated}.scene-label{position:absolute;z-index:2;left:10px;top:9px;background:#080d20cc;border:1px solid #7786b7;padding:5px 8px;font-size:12px;color:var(--gold)}.story{padding:14px 14px 12px;background:#11172e;border-top:2px solid #7383b9;min-height:115px}.speaker{color:var(--gold);font-weight:bold;margin-bottom:8px;font-size:14px}.text{line-height:1.9;font-size:14px;white-space:pre-line}.next{display:block;margin:10px 0 0 auto;background:#28365f;border:2px solid #8496d0;padding:8px 15px;border-radius:4px;color:white}.next:after{content:" ▼";color:var(--gold)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}.stat{background:#151c37;border:1px solid #3d4c7b;padding:7px;border-radius:4px;text-align:center;font-size:11px;color:var(--muted)}.stat strong{display:block;color:var(--white);font-size:14px;margin-top:4px}.panel{background:var(--panel);border:2px solid #4d5e91;border-radius:5px;padding:10px;margin:9px 0}.panel h2{font-size:13px;color:var(--gold);margin:0 0 9px;letter-spacing:.05em}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.action{background:linear-gradient(#28365e,#1b2545);border:2px solid #6174aa;border-radius:4px;text-align:left;padding:10px;min-height:54px;line-height:1.5}.action strong{display:block;font-size:13px}.action small{display:block;color:#c2cce8;font-size:11px;margin-top:3px}.action:active,.action:hover{border-color:var(--gold);background:#35446f}.action.primary{border-color:var(--gold)}.action:disabled{opacity:.45;cursor:not-allowed}.party{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.member{border:1px solid #485987;background:#10162c;padding:8px;border-radius:4px}.member-head{display:flex;justify-content:space-between;gap:4px;font-size:12px;font-weight:bold}.role{font-size:10px;color:var(--muted);font-weight:normal}.bar{height:7px;background:#34364e;border-radius:2px;overflow:hidden;margin:6px 0 3px}.bar i{display:block;height:100%;background:var(--green)}.bar.mp i{background:var(--blue)}.member small{font-size:10px;color:var(--muted)}.battlefield{display:flex;align-items:center;justify-content:space-around;min-height:125px;padding:12px;background:#111a35;border-bottom:1px solid #43527d}.fighter{text-align:center;min-width:30%;}.fighter .emoji{font-size:46px;filter:drop-shadow(3px 4px 0 #050712)}.fighter .name{font-size:12px;margin-top:5px;color:var(--gold)}.fighter .hp{font-size:10px;color:var(--muted);margin-top:4px}.vs{color:var(--gold);font-weight:bold}.log{max-height:135px;overflow:auto;font-size:11px;line-height:1.75;color:#d1d9f2;background:#0b1022;border:1px solid #34436d;padding:8px}.log p{margin:0 0 4px}.bottom{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin:12px 0}.bottom button{background:#171f3c;border:1px solid #536492;border-radius:4px;padding:8px 10px;font-size:11px}.ending{color:var(--gold);font-weight:bold}.hidden{display:none!important}.foot{text-align:center;color:#8997bd;font-size:10px;margin:10px 0 18px}.toast{color:var(--green);font-size:11px;min-height:17px;margin-top:5px}@media(max-width:420px){body{padding:8px}.scene{min-height:155px}.stats{grid-template-columns:repeat(2,1fr)}.actions{grid-template-columns:1fr}.party{grid-template-columns:1fr 1fr}.text{font-size:13px}.panel{padding:8px}}
</style></head><body><main class="shell">
<header class="top"><div class="brand">★ 星喰みの夜</div><div class="chip">COMMAND RPG / PROLOGUE</div></header>
<section class="screen">
 <div class="scene" id="scene"><div class="moon"></div><div class="mountain"></div><div class="scene-label" id="sceneLabel">第一章　星の降らない夜</div><div class="scene-art" id="sceneArt">🏚️</div></div>
 <div class="story"><div class="speaker" id="speaker">ナレーション</div><div class="text" id="storyText">星が消えた夜、物語が始まる。</div><button class="next" id="nextBtn">つづきを読む</button></div>
 <div id="battlefield" class="battlefield hidden"></div>
</section>
<div class="stats"><div class="stat">CHAPTER<strong id="chapterStat">01 / 04</strong></div><div class="stat">所持金<strong><span id="gold">120</span> G</strong></div><div class="stat">討伐数<strong id="kills">0</strong></div><div class="stat">絆<strong id="bond">0</strong></div></div>
<section class="panel"><h2 id="actionTitle">▶ どうする？</h2><div class="actions" id="actions"></div><div id="toast" class="toast"></div></section>
<section class="panel"><h2>◆ なかま</h2><div class="party" id="party"></div></section>
<section class="panel"><h2>◆ 冒険の記録</h2><div class="log" id="log" aria-live="polite"><p>— 星明かりの記録帳 —</p></div></section>
<div class="bottom"><button id="saveBtn">💾 セーブ</button><button id="loadBtn">📂 ロード</button><button id="resetBtn">↻ 最初から</button></div><div class="foot">スマートフォン対応・移動なしの選択式RPG<br>セーブデータはこのブラウザ内に保存されます</div>
</main>
<script>
const $=id=>document.getElementById(id);const clone=x=>JSON.parse(JSON.stringify(x));
const initialParty=[
{id:'ren',name:'レン',role:'星守の剣士',face:'🧑🏻‍🚀',hp:42,maxHp:42,mp:12,maxMp:12,atk:11,def:5,skill:'星斬り',alive:true},
{id:'yuna',name:'ユナ',role:'記憶を読む魔導士',face:'🧙🏻‍♀️',hp:30,maxHp:30,mp:24,maxMp:24,atk:6,def:3,skill:'蒼い火',alive:true},
{id:'kai',name:'カイ',role:'無口な盾役',face:'🛡️',hp:50,maxHp:50,mp:8,maxMp:8,atk:8,def:9,skill:'かばう',alive:true},
{id:'mio',name:'ミオ',role:'歌う旅の治癒師',face:'🎼',hp:34,maxHp:34,mp:20,maxMp:20,atk:5,def:4,skill:'星詠みの歌',alive:true}];
let G;function fresh(){return {scene:0,chapter:1,gold:120,kills:0,bond:0,party:clone(initialParty),potions:3,ethers:2,flags:{},mode:'story',enemy:null,turn:0,queued:null,storyIndex:0,ended:false,log:[]}}
// Narrative is original: four chapters, companion secrets, a choice-driven finale.
const scenes=[
{chapter:1,label:'第一章　星の降らない夜',art:'🏚️',speaker:'ナレーション',text:'この世界では、人が生まれた夜に星がひとつ灯る。\nそして死ぬとき、その星は空へ帰る。\n\n——十年前、空から星が消えた。\n人々はそれを「星喰み」と呼び、希望を口にしなくなった。',choices:[['物語を始める','村はずれの鐘が、十三回鳴った。',1]]},
{chapter:1,label:'第一章　星の降らない夜',art:'🔔',speaker:'レン',text:'「十三回……？　鐘は十二回までのはずだ」\n\n亡き母の形見である小さな星石が、胸元で熱を帯びた。村の広場から、誰かの悲鳴が聞こえる。',choices:[['広場へ走る','暗闇の中で、幼い少女が黒い獣に囲まれていた。',2]]},
{chapter:1,label:'第一章　星の降らない夜',art:'🐺',speaker:'謎の少女',text:'「来ないで！　こいつら、私の名前を食べようとしてる！」\n\n獣の目には星空が映っていた。レンが剣を抜くと、星石がまばゆく輝いた。',battle:'shadeWolf',after:3},
{chapter:1,label:'第一章　星の降らない夜',art:'🌠',speaker:'ユナ',text:'「あなたの剣……星の力に反応したの？」\n\n少女はユナと名乗った。彼女は人の記憶を読む力を持つが、自分の過去だけは思い出せないという。',choices:[['ユナを仲間に迎える','「記憶がなくても、今ここにいる君は本物だ」レンの言葉に、ユナは初めて笑った。',4,'bond']]},
{chapter:1,label:'第一章　星の降らない夜',art:'👴🏻',speaker:'村の司祭',text:'「星喰みは、ただ星を奪う災厄ではない。人々の記憶と、誰かを想う心を少しずつ食べていく」\n\n司祭は古い地図を広げた。北の鐘楼、その地下に星の欠片が眠っているらしい。',choices:[['鐘楼の地下へ','階段の先には、壁一面に名前が刻まれていた。最後の一行だけ、削り取られている。',5]]},
{chapter:1,label:'第一章　第一の欠片',art:'🕯️',speaker:'カイ',text:'「……この名前、俺の字だ」\n\n鎧をまとった青年カイが現れた。彼はかつてこの鐘楼を守っていたという。だが、なぜここを離れたのか、本人にもわからない。',choices:[['カイの話を聞く','「思い出せなくても、守りたいものがある。それだけは覚えてる」カイは仲間になることを選んだ。',6,'bond']]},
{chapter:1,label:'第一章　第一の欠片',art:'💎',speaker:'ナレーション',text:'地下祭壇に浮かぶ星の欠片。触れた瞬間、レンの脳裏に知らない景色が流れ込んだ。\n\n母が誰かを抱きしめて泣いている。\n「ごめんね。あなたを忘れるくらいなら、世界に嫌われてもいい」\n\nその声は、レンの母のものだった。',choices:[['欠片を手に取る','遠くで、誰かが静かに目を開いた。',7]]},
{chapter:2,label:'第二章　歌のない森',art:'🌲',speaker:'ナレーション',text:'星の欠片を求め、一行は「眠り森」へ向かう。そこでは、住人たちが大切な人の名前を思い出せなくなっていた。森の奥から、聞き覚えのある子守歌が流れてくる。',choices:[['歌声の方へ進む','木々の間に、小さな家が一軒だけ残っていた。',8]]},
{chapter:2,label:'第二章　歌のない森',art:'🎼',speaker:'ミオ',text:'「その歌……私、知ってる。なのに、誰が歌ってくれたのか思い出せない」\n\n家の前にいた旅の治癒師ミオは、歌うことで仲間の傷を癒やせた。彼女の首には、レンの星石と同じ紋章が刻まれていた。',choices:[['ミオに一緒に来てもらう','「私の記憶が誰かの役に立つなら、探す意味もあるよね」ミオはそっと頷いた。',9,'bond']]},
{chapter:2,label:'第二章　森の守り手',art:'🦌',speaker:'森の守り手',text:'「欠片を渡せ。さもなくば、お前たちの大切な記憶を森に捧げてもらう」\n\n巨大な角を持つ獣が立ちはだかる。だが、その目には怒りではなく、深い悲しみがあった。',battle:'mossGuardian',after:10},
{chapter:2,label:'第二章　歌のない森',art:'🌳',speaker:'森の守り手',text:'「……私は、娘の名を忘れた。忘れたくなかったのに」\n\n倒れた守り手の涙から、二つ目の欠片が現れた。ユナがそれに触れると、知らない記憶が彼女の中で目を覚ました。',choices:[['ユナの様子を見る','「私……昔、星を数える子どもだった。空から星が落ちる前に、誰かと約束したの」',11]]},
{chapter:2,label:'第二章　忘れられた約束',art:'🌌',speaker:'ユナ',text:'「約束の相手は、顔だけが見えない。でも、私はその人を……」\n\n言葉が途切れた瞬間、森の空に黒い裂け目が走った。裂け目の向こうから、レンと同じ声が聞こえる。',choices:[['声の主を追う','「やっと来たね、レン。君が僕を忘れてくれていてよかった」',12]]},
{chapter:3,label:'第三章　鏡の王都',art:'🏰',speaker:'ナレーション',text:'三つ目の欠片が眠る王都は、鏡の壁に囲まれていた。鏡に映る人々は、失った記憶の中で幸せそうに暮らしている。現実に戻ろうとする者は、誰もいなかった。',choices:[['王宮へ向かう','玉座に座っていたのは、顔を仮面で隠した王だった。',13]]},
{chapter:3,label:'第三章　鏡の王都',art:'👑',speaker:'仮面の王',text:'「人は忘れるから苦しむ。悲しみも後悔も、愛した人を失う痛みも。私が星を喰らったのは、世界を救うためだ」\n\n「忘れさせることが救いなのか？」レンが問うと、王は仮面に手をかけた。',choices:[['王の仮面を見届ける','仮面の下にあった顔を見て、ユナが息を呑んだ。',14]]},
{chapter:3,label:'第三章　鏡の王都',art:'🪞',speaker:'ユナ',text:'「……あなたは、私の兄さん？」\n\n王は、ユナが失った記憶の中にいた兄・セイだった。彼は星喰みを止めるため、世界中の悲しみを自分ひとりに集めようとした。だが、悲しみを受け止めきれず、星そのものを喰らう怪物になりかけていた。',choices:[['セイに剣を向ける','「ユナ、僕を止めてくれ。僕が僕でいられるうちに」','battle:mirrorKing',15,'bond']]},
{chapter:3,label:'第三章　鏡の王都',art:'🗡️',speaker:'セイ',text:'「最後の欠片は、星のない空の向こうにある。そこへ行けば、すべての答えがわかる」\n\nセイは三つ目の欠片を託した。彼の姿は光となって消えたが、ユナの手には温かな指輪だけが残った。',choices:[['空の裂け目へ','四つの欠片が共鳴し、空に道が開いた。',16]]},
{chapter:4,label:'第四章　星の向こう側',art:'🌑',speaker:'ナレーション',text:'空の向こうにあったのは、神殿ではなかった。無数の星が眠る、静かな海だった。そこに立つ人物は、レンと同じ顔をしていた。',choices:[['もうひとりのレンに話しかける','「僕は、君が生まれる前に捨てられた“最初の願い”だ」',17]]},
{chapter:4,label:'第四章　星の向こう側',art:'🌠',speaker:'もうひとりのレン',text:'「星喰みは悪意じゃない。人々が忘れたいと願った悲しみを、誰かが受け止め続けた結果なんだ」\n\nレンの母は、世界から悲しみを消すため、最初の願いを星の海に封じた。その代償に、母は自分の息子の未来を失いかけた。',choices:[['真実を受け止める','「忘れれば、痛みは消える。でも、痛みと一緒に大切なものまで消えてしまう」',18]]},
{chapter:4,label:'第四章　最後の選択',art:'⚖️',speaker:'もうひとりのレン',text:'星の海が崩れ始めた。世界を救う方法は二つ。\n\nひとつは、星をすべて解き放ち、悲しみも記憶も世界へ返すこと。\nもうひとつは、星を再び封じ、誰も傷つかない代わりに、誰も大切な人を思い出せない世界を作ること。\n\n仲間たちは、レンの答えを待っている。',choices:[['星喰みと最後の戦いへ','戦いの先で、世界の未来を選ぶ','battle:starEater',21]]},
{chapter:4,label:'第四章　最後の選択',art:'⚖️',speaker:'仲間たち',text:'星喰みは消えかけている。けれど、最後の星が砕ける前に決めなければならない。世界を救う方法は二つ。\n\nひとつは、星を解き放ち、悲しみも記憶も世界へ返すこと。\nもうひとつは、星を再び封じ、誰も傷つかない代わりに、誰も大切な人を思い出せない世界を作ること。',choices:[['記憶も悲しみも、世界へ返す','ending_light',19,'light'],['悲しみを封じ、安らぎを選ぶ','ending_sleep',20,'sleep']]},
{chapter:4,label:'終章　星明かりの朝',art:'🌅',speaker:'ナレーション',text:'夜明け。人々は失った記憶を取り戻し、泣き、笑い、名前を呼び合った。痛みは消えなかった。けれど、誰かの手を握る温かさも戻ってきた。\n\nユナは兄の指輪を胸にしまい、ミオはあの子守歌を最後まで歌った。カイは、守れなかった過去ではなく、これから守るものを見つめた。\n\nレンの星石が、空の一番高い場所で輝いた。——星は、誰かを想う心の中に生まれる。',ending:true},
{chapter:4,label:'終章　眠り続ける世界',art:'🌙',speaker:'ナレーション',text:'世界は静かな安らぎに包まれた。誰も悲しまず、誰も過去を悔やまない。けれど、誰も誰かの名を呼ばなくなった。\n\n仲間たちはレンのそばにいる。笑顔を浮かべている。なのに、レンの胸には消えない空白があった。\n\n空には星が戻った。けれど、その光はどこか遠く、手を伸ばしても届かなかった。',ending:true}
];
const enemies={shadeWolf:{name:'影喰いの獣',face:'🐺',hp:42,atk:7,def:2,xp:18,gold:25,desc:'名前を食べる黒い獣'},mossGuardian:{name:'森の守り手',face:'🦌',hp:88,atk:10,def:4,xp:38,gold:55,desc:'悲しみに囚われた古き守護者'},mirrorKing:{name:'鏡の王',face:'👑',hp:115,atk:13,def:5,xp:60,gold:80,desc:'世界の悲しみを背負った王'},starEater:{name:'星喰み',face:'🌑',hp:155,atk:16,def:6,xp:100,gold:150,desc:'最初の願いの成れの果て'}};
function sayScene(){let s=scenes[G.scene];$('sceneLabel').textContent=s.label;$('sceneArt').textContent=s.art;$('speaker').textContent=s.speaker;$('storyText').textContent=s.text;$('nextBtn').classList.toggle('hidden',!!(s.choices||s.battle||s.ending));$('battlefield').classList.add('hidden');$('scene').classList.remove('hidden');$('actionTitle').textContent=s.ending?'▶ 物語の結末':'▶ 選択してください';$('actions').innerHTML='';if(s.choices)renderChoices(s.choices);else if(s.battle)beginBattle(s.battle,s.after);else if(s.ending){G.ended=true;addAction('最初から遊ぶ','別の選択も試してみよう',()=>{G=fresh();sayScene();renderAll()},true);addAction('セーブする','この結末を記録する',saveGame)}renderAll()}
function renderChoices(choices){$('actions').innerHTML='';choices.forEach(c=>addAction(c[0],c[1].startsWith('ending_')?'世界の未来を決める':(c[1].startsWith('battle:')?c[1].includes('mirrorKing')?'王との決着':'最後のボス戦':'物語を進める'),()=>{if(c[1]==='ending_light'){G.scene=19;G.flags.ending='light'}else if(c[1]==='ending_sleep'){G.scene=20;G.flags.ending='sleep'}else if(c[1].startsWith('battle:')){if(c[3]==='bond')G.bond++;beginBattle(c[1].split(':')[1],c[2])}else{if(c[3]==='bond')G.bond++;G.scene=c[2]}saySceneIfNoBattle()},true))}
function saySceneIfNoBattle(){if(G.enemy)return;sayScene()}
function addAction(title,desc,fn,primary=false,disabled=false){let b=document.createElement('button');b.className='action'+(primary?' primary':'');b.disabled=disabled;b.innerHTML='<strong>'+title+'</strong><small>'+desc+'</small>';b.onclick=fn;$('actions').appendChild(b);return b}
function beginBattle(key,after){G.mode='battle';G.enemy={...enemies[key],maxHp:enemies[key].hp,key,after};G.turn=0;G.queued={};$('scene').classList.add('hidden');$('nextBtn').classList.add('hidden');$('battlefield').classList.remove('hidden');battleRender();$('actionTitle').textContent='▶ コマンドを選ぶ';battleMenu();renderAll();log('⚔ '+G.enemy.name+'が現れた！')}
function battleRender(){let e=G.enemy;if(!e)return;$('battlefield').innerHTML='<div class="fighter"><div class="emoji">'+G.party[0].face+'</div><div class="name">レンたち</div><div class="hp">全員の状態は下に表示</div></div><div class="vs">VS</div><div class="fighter"><div class="emoji">'+e.face+'</div><div class="name">'+e.name+'</div><div class="bar"><i style="width:'+Math.max(0,e.hp/e.maxHp*100)+'%;background:var(--red)"></i></div><div class="hp">HP '+Math.max(0,e.hp)+' / '+e.maxHp+'</div></div>'}
function battleMenu(){if(!G.enemy)return;$('actions').innerHTML='';addAction('⚔ たたかう','通常攻撃を選ぶ',()=>selectActor('attack'),true);addAction('✨ とくぎ','星斬り・蒼い火・回復の歌',()=>skillMenu());addAction('🧪 どうぐ','やくそう '+G.potions+'個 / 魔力薬 '+G.ethers+'個',()=>itemMenu());addAction('🛡 ぼうぎょ','次の敵攻撃を軽減',()=>selectActor('guard'));}
function selectActor(type){$('actions').innerHTML='';G.party.forEach((p,i)=>{if(p.hp<=0)return;addAction(p.face+' '+p.name,p.role+' / HP '+p.hp+' MP '+p.mp,()=>{if(type==='attack'){let d=Math.max(1,p.atk+rand(5)-G.enemy.def);G.enemy.hp-=d;log(p.name+'の攻撃！ '+d+'ダメージ！');afterPlayerAction()}else if(type==='guard'){p._guard=true;log(p.name+'は身構えた。');enemyTurn()} });});addAction('もどる','コマンド選択へ',battleMenu)}
function skillMenu(){$('actions').innerHTML='';G.party.forEach((p,i)=>{if(p.hp<=0)return;let cost= p.id==='ren'?4:p.id==='yuna'?5:p.id==='kai'?3:4;let desc=p.id==='ren'?'敵に強力な一撃':p.id==='yuna'?'魔法で大ダメージ':p.id==='kai'?'仲間全体を守る':'仲間全員を回復';addAction(p.face+' '+p.skill,'MP '+cost+' / '+desc,()=>{if(p.mp<cost){toast('MPが足りない！');return}p.mp-=cost;if(p.id==='ren'){let d=Math.max(8,p.atk*2+rand(8)-G.enemy.def);G.enemy.hp-=d;log('レンの星斬り！ '+d+'ダメージ！')}else if(p.id==='yuna'){let d=Math.max(10,18+rand(10)-G.enemy.def);G.enemy.hp-=d;log('ユナの蒼い火！ '+d+'ダメージ！')}else if(p.id==='kai'){G.party.forEach(q=>q._guard=true);log('カイが全員をかばう！')}else{G.party.forEach(q=>{if(q.hp>0)q.hp=Math.min(q.maxHp,q.hp+18)});log('ミオの歌が仲間を癒やす！')}afterPlayerAction()})});addAction('もどる','コマンド選択へ',battleMenu)}
function itemMenu(){$('actions').innerHTML='';addAction('🧪 やくそう ×'+G.potions,'HPが一番減った仲間を25回復',()=>{if(!G.potions)return toast('やくそうがない！');G.potions--;let p=G.party.filter(p=>p.hp>0).sort((a,b)=>(a.hp/a.maxHp)-(b.hp/b.maxHp))[0];if(p)p.hp=Math.min(p.maxHp,p.hp+25);log('やくそうを使った。');enemyTurn()});addAction('🔷 魔力薬 ×'+G.ethers,'全員のMPを6回復',()=>{if(!G.ethers)return toast('魔力薬がない！');G.ethers--;G.party.forEach(p=>p.mp=Math.min(p.maxMp,p.mp+6));log('魔力薬を使った。');enemyTurn()});addAction('もどる','コマンド選択へ',battleMenu)}
function afterPlayerAction(){if(G.enemy.hp<=0){winBattle();return}battleRender();renderAll();enemyTurn()}
function enemyTurn(){if(!G.enemy)return;if(G.enemy.hp<=0){winBattle();return}G.turn++;let targets=G.party.filter(p=>p.hp>0);if(!targets.length){log('仲間たちは倒れてしまった……。');G.party.forEach(p=>{p.hp=Math.max(1,Math.floor(p.maxHp*.4));p.mp=Math.max(1,Math.floor(p.maxMp*.4));p._guard=false});G.gold=Math.floor(G.gold*.9);G.enemy.hp=G.enemy.maxHp;log('村で目を覚ました。所持金の一部を失った。');G.mode='story';G.enemy=null;sayScene();return}let t=targets[rand(targets.length)];let dmg=Math.max(1,G.enemy.atk+rand(5)-t.def);if(t._guard){dmg=Math.max(1,Math.floor(dmg*.4));t._guard=false}t.hp=Math.max(0,t.hp-dmg);log(G.enemy.name+'の攻撃！ '+t.name+'に'+dmg+'ダメージ！');if(G.turn%3===0&&G.enemy.hp<G.enemy.maxHp*.6){let healed=Math.min(8,G.enemy.maxHp-G.enemy.hp);G.enemy.hp+=healed;log(G.enemy.name+'は星の力でHPを'+healed+'回復した！')}battleRender();renderAll();battleMenu()}
function winBattle(){let e=G.enemy;G.kills++;G.gold+=e.gold;log(e.name+'を倒した！ '+e.gold+'Gを手に入れた。');G.party.forEach(p=>{p.hp=Math.min(p.maxHp,p.hp+5);p.mp=Math.min(p.maxMp,p.mp+3)});let after=e.after;G.enemy=null;G.mode='story';if(after===3){G.scene=3}else if(after===10){G.scene=10}else if(after===15){G.scene=15}else{G.scene=after||G.scene+1}sayScene()}
function rand(n){return Math.floor(Math.random()*n)}function log(t){G.log.unshift(t);G.log=G.log.slice(0,24);$('log').innerHTML=G.log.map(x=>'<p>› '+escapeHtml(x)+'</p>').join('')}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(t){$('toast').textContent=t;setTimeout(()=>{$('toast').textContent=''},1800)}
function renderAll(){ $('gold').textContent=G.gold;$('kills').textContent=G.kills;$('bond').textContent=G.bond;$('chapterStat').textContent=String(G.chapter).padStart(2,'0')+' / 04';G.chapter=scenes[G.scene]?.chapter||4;$('chapterStat').textContent=String(G.chapter).padStart(2,'0')+' / 04';$('party').innerHTML=G.party.map(p=>'<div class="member"><div class="member-head"><span>'+p.face+' '+p.name+'</span><span class="role">'+p.role+'</span></div><div class="bar"><i style="width:'+Math.max(0,p.hp/p.maxHp*100)+'%;background:'+(p.hp/p.maxHp<.25?'var(--red)':'var(--green)')+'"></i></div><small>HP '+p.hp+'/'+p.maxHp+'</small><div class="bar mp"><i style="width:'+p.mp/p.maxMp*100+'%"></i></div><small>MP '+p.mp+'/'+p.maxMp+'</small></div>').join('');if(G.enemy)battleRender()}
$('nextBtn').onclick=()=>{if(G.scene===0){G.scene=1}else{G.scene=Math.min(G.scene+1,scenes.length-1)}sayScene()};$('saveBtn').onclick=()=>{try{localStorage.setItem('hoshiRpgV2',JSON.stringify(G));toast('セーブしたよ！')}catch(e){toast('セーブできませんでした')}};$('loadBtn').onclick=()=>{try{let s=localStorage.getItem('hoshiRpgV2');if(!s){toast('セーブデータがないよ');return}G=JSON.parse(s);if(G.enemy){G.mode='battle';$('scene').classList.add('hidden');$('battlefield').classList.remove('hidden');battleRender();battleMenu()}else sayScene();renderAll();toast('ロードしたよ！')}catch(e){toast('ロードできませんでした')}};$('resetBtn').onclick=()=>{if(confirm('最初から遊ぶ？ 今の進行状況は消えるよ。')){G=fresh();G.log=[];log('— 星明かりの記録帳 —');sayScene()}};
G=fresh();log('— 星明かりの記録帳 —');sayScene();
</script></body></html>
