<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10172b">
<title>星を継ぐ者たち — 失われた記憶と、もう一つの未来</title>
<style>
:root{--bg:#0b1020;--panel:#151f36;--panel2:#0d1529;--line:#6c8bb8;--gold:#f6d77a;--text:#f5f3e8;--muted:#aab8d0;--blue:#70c6ff;--red:#ff8585;--green:#8be0a1}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at top,#263d68 0%,#0b1020 68%);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.app{max-width:760px;margin:auto;padding:10px 12px 24px}.brand{text-align:center;padding:8px 4px 12px}.eyebrow{font-size:11px;letter-spacing:.3em;color:var(--blue)}h1{font-size:clamp(23px,6vw,36px);margin:5px 0 3px;color:#fff3c5;text-shadow:0 3px #584d76,0 0 18px #74a8ff;letter-spacing:.08em}.subtitle{font-size:12px;color:#c1cce0}
.panel{background:linear-gradient(145deg,rgba(26,39,65,.97),rgba(11,19,37,.98));border:2px solid #405b83;border-radius:10px;padding:12px;margin:9px 0;box-shadow:0 5px 0 #070b16, inset 0 0 0 1px #172943}
h2{font-size:15px;margin:0 0 9px;color:var(--gold);letter-spacing:.06em}.small{font-size:12px;color:var(--muted);line-height:1.65}.scene{background:#080e1d;border:2px solid #9ab9e5;border-radius:7px;overflow:hidden;position:relative;box-shadow:0 0 0 2px #101a2c,0 0 22px #3e6fb355}.scene canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges}.sceneLabel{position:absolute;top:7px;left:8px;padding:3px 7px;background:#081122dc;border:1px solid #8aa9d4;border-radius:4px;font-size:11px;color:#dceaff}
.dialogue{margin-top:9px;background:#070d1c;border:2px solid #8ba8d1;border-radius:6px;padding:11px;line-height:1.85;font-size:14px;white-space:pre-line;min-height:70px}.speaker{font-size:12px;color:var(--gold);margin-bottom:4px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.btn{border:1px solid #6486b3;background:linear-gradient(#243b5f,#152541);padding:11px 9px;border-radius:6px;text-align:left;min-height:47px;box-shadow:0 3px 0 #080e1b;font-size:13px;line-height:1.45}.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #080e1b}.btn strong{display:block;color:#fff1bc;font-size:13px}.btn small{display:block;color:#bacce3;font-size:11px;margin-top:3px}.btn.gold{border-color:#d4b866;background:linear-gradient(#51482d,#292a30)}.btn.red{border-color:#ba7777}.btn:disabled{opacity:.42;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.pill{font-size:11px;padding:3px 7px;border:1px solid #506b91;border-radius:20px;color:#cfe4ff}.status{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.member{padding:8px;background:#0a1326;border:1px solid #344d70;border-radius:6px;min-width:0}.memberTop{display:flex;gap:8px;align-items:center}.portrait{width:46px;height:46px;flex:none;background:#07101f;border:1px solid #526d94;border-radius:4px}.name{font-weight:800;font-size:13px}.role{font-size:10px;color:var(--gold)}.statline{font-size:11px;margin-top:5px;color:#d6e2f4}.bar{height:5px;background:#26334b;border-radius:6px;overflow:hidden;margin-top:3px}.bar span{display:block;height:100%;background:var(--green)}.bar.mp span{background:#72b9ff}
.enemybar{height:7px;background:#422a39;border-radius:5px;overflow:hidden;margin:7px 0}.enemybar span{display:block;height:100%;background:#f07179}
.log{font-size:12px;line-height:1.7;max-height:140px;overflow:auto;background:#080e1b;border:1px solid #344c6e;padding:8px;border-radius:5px}.log p{margin:2px 0}.sectionHead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:3px 0}.tab{flex:1;min-width:70px;text-align:center;font-size:11px;border:1px solid #405a7e;background:#0d172b;padding:8px 4px;border-radius:5px}.tab.active{background:#334b70;border-color:#d7bd73;color:#fff0b0}
.hidden{display:none!important}.choiceNote{padding:9px;border-left:3px solid var(--gold);background:#111b30;color:#dce5f3;font-size:12px;line-height:1.7;margin-bottom:8px}.ending{text-align:center;padding:20px 8px}.ending h2{font-size:24px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.status{grid-template-columns:repeat(4,minmax(0,1fr))}.app{padding-top:18px}}
</style>
</head>
<body>
<div class="app">
<header class="brand"><div class="eyebrow">A PIXEL FANTASY RPG</div><h1>星を継ぐ者たち</h1><div class="subtitle">— 失われた記憶と、もう一つの未来 —</div></header>
<section class="panel">
 <div class="scene"><canvas id="art" width="320" height="150" aria-label="ドット絵の物語シーン"></canvas><div class="sceneLabel" id="sceneLabel">第一章　星降りの夜</div></div>
 <div class="dialogue"><div class="speaker" id="speaker">語り部</div><div id="dialogue">星が降る夜、物語は始まる。</div></div>
</section>
<section class="panel">
 <div class="sectionHead"><h2 id="mainTitle">物語を始める</h2><span class="pill" id="chapterPill">第一章</span></div>
 <div id="storyChoices" class="grid"></div>
 <div id="battleUI" class="hidden">
  <div class="row"><strong id="enemyName">魔物</strong><span class="pill" id="enemyLevel">Lv.1</span></div>
  <div class="enemybar"><span id="enemyHP" style="width:100%"></span></div>
  <div class="small" id="enemyStats"></div>
  <div style="height:8px"></div>
  <div class="grid" id="battleCommands"></div>
 </div>
</section>
<section class="panel">
 <div class="sectionHead"><h2>仲間たち</h2><span class="pill" id="partyLevel">平均 Lv.1</span></div>
 <div id="party" class="status"></div>
</section>
<section class="panel">
 <div class="tabs" id="tabs">
  <button class="tab active" data-tab="journal">冒険の記録</button><button class="tab" data-tab="items">道具</button><button class="tab" data-tab="equip">装備</button><button class="tab" data-tab="skills">特技・魔法</button>
 </div>
 <div id="tabContent" style="margin-top:10px"></div>
</section>
<section class="panel">
 <h2>冒険の記録</h2><div class="log" id="log"><p>星の光が、静かに世界を照らしている。</p></div>
 <div class="grid" style="margin-top:9px"><button class="btn" id="saveBtn"><strong>💾 セーブ</strong><small>このブラウザに保存</small></button><button class="btn" id="loadBtn"><strong>📂 ロード</strong><small>保存データから再開</small></button><button class="btn red" id="resetBtn"><strong>↻ 最初から</strong><small>新しい冒険を始める</small></button></div>
 <div class="small" style="margin-top:8px">セーブはこの端末・ブラウザ内に保存されます。ブラウザのデータを消去すると消える場合があります。</div>
</section>
<footer class="small" style="text-align:center;padding:8px">© 星を継ぐ者たち — 旅の選択が、星の運命を変える。</footer>
</div>

{title:"第一章　星降りの夜",place:"ルミナ村",intro:"十七年前、空から七つの星が消えた夜。世界は少しずつ、昨日の記憶を失い始めた。辺境の村ルミナで暮らす青年ユウは、星祭りの夜に、誰も知らない声を聞く。『星を返して。そうしなければ、君は君自身を忘れる』。その瞬間、夜空に黒い亀裂が走った。",objective:"村を襲った影の獣を退け、青い星片を調べる",boss:"記憶喰らい",after:"星片に触れたユウは、見知らぬ少女の記憶を見る。少女は自分を『セレネ』と呼び、ユウの名を知っていた。村の古老は、北の王都に星片の記録があると告げる。"},
{title:"第二章　沈黙の王都",place:"王都アステラ",intro:"王都では、王の名を覚えている者が一人もいなかった。玉座だけが残り、王家の肖像画は白紙に変わっている。王都の記録官マリアは、禁書庫に残された一行を見つける。『星を集める者は、世界を救うのではない。世界を選び直すのだ』。",objective:"禁書庫の封印を解き、星片の真実を探る",boss:"白銀の騎士",after:"禁書庫の奥で、マリアは自分の家系が星の封印を守る一族だと知る。騎士は倒れる直前、敵ではなく王都を守っていたのだと語った。彼が守っていた扉の向こうには、空に浮かぶ古代都市の地図があった。"},
{title:"第三章　時を編む森",place:"エルディア樹海",intro:"樹海の奥では、昨日と明日が同じ道に重なっていた。森の守り手レイナは、何度も同じ別れを夢に見るという。旅人たちは、まだ出会っていない仲間の声を聞き、失ったはずの人の影を見た。森の中心に立つ大樹は、ユウに問いかける。『救いたい過去のために、今を捨てる覚悟はあるか』。",objective:"時の樹を守る三つの紋章を集める",boss:"逆さ時計の魔人",after:"レイナは、未来の自分が世界を滅ぼす場面を見せられる。しかし彼女は未来を拒むのではなく、選び直すと決める。星片は過去を戻す鍵ではなく、可能性を一つに縛る鎖だった。"},
{title:"第四章　空葬の城",place:"天空城ネメシア",intro:"雲海の上に眠る天空城は、世界がまだ一つだった時代の記憶を宿していた。そこで一行は、敵の将軍カイルと出会う。彼は星を奪う理由を語る。星の力で世界を一つの正しい歴史に戻せば、誰も大切な人を失わずに済むのだと。彼の言葉は、ユウ自身が心の奥で願っていたことでもあった。",objective:"天空城の四つの試練を越え、星の核へ向かう",boss:"星喰いの将軍カイル",after:"カイルの仮面の下にあったのは、ユウと同じ星の紋章だった。二人は幼い頃、同じ事故で記憶を失っていた。カイルこそ、消えた星の守護者の一人。そして星を集める声の主は、世界を壊した魔王ではなかった。"},
{title:"第五章　ふたつの夜明け",place:"星の心臓",intro:"世界の中心で、セレネが目を覚ました。彼女は最初の星守であり、世界が分かたれた日に、自らの記憶を七つの星に封じた存在だった。世界は一度、悲しみを消すためにすべての選択を奪われかけた。セレネはその過ちを止めるため、世界から自分の存在を消したのだ。いま、最後の星が問う。『悲しみのない世界と、誰かを失うかもしれない自由。君はどちらを選ぶ？』",objective:"星の審判を越え、世界の未来を選ぶ",boss:"星の心臓・虚無の王",after:"最後の選択が世界の姿を決める。星の光は、誰かが決めた正しさではなく、一人ひとりが選ぶ明日を照らすためにある。"}

 if(ch===1)showChoices("記録官マリア","マリア「記録は嘘をつかない……でも、記録を書いた人間は嘘をつく。私の一族の名が、禁書庫から消されているの」",[
 {title:"一緒に禁書庫へ",desc:"マリアの信頼を得る",fn:()=>{G.bond++;G.party[1].friend+=2;startBattle("wisp","normal")}},
 {title:"まず騎士団に話を聞く",desc:"装備品の手がかりを得る",fn:()=>{G.gold+=15;startBattle("wisp","normal")}}
 ]);
 else if(ch===2)showChoices("森の守り手レイナ","レイナ「この森では、未来の自分に会うことがある。私が見た未来では、私はあなたを裏切っていた」",[
 {title:"未来は変えられる",desc:"レイナの絆が深まる",fn:()=>{G.bond+=2;G.party[2].friend+=2;startBattle("thorn","normal")}},
 {title:"裏切りの理由を聞く",desc:"星の秘密を知る",fn:()=>{G.star++;startBattle("thorn","normal")}}
 ]);
 else if(ch===3)showChoices("仮面の将軍カイル","カイル「世界は悲しみを繰り返す。私が星を集めれば、誰も失わない歴史に戻せる。お前なら……その意味が分かるはずだ」",[
 {title:"カイルの言葉を否定する",desc:"自由を守る意志",fn:()=>{G.bond++;G.flags.defiedKyle=true;startBattle("golem","normal")}},
 {title:"彼の願いを理解しようとする",desc:"特別な結末への道",fn:()=>{G.flags.understoodKyle=true;G.bond+=2;startBattle("golem","normal")}}
 ]);
 else showChoices("セレネ","セレネ「悲しみを消せば、喜びも消える。それでも、誰かを失う未来を拒みたい？」",[
 {title:"自由な未来を選ぶ",desc:"可能性を残す",fn:()=>{G.flags.free=true;G.bond+=1;startBattle("void","final")}},
 {title:"悲しみのない世界を望む",desc:"星の力で世界を固定する",fn:()=>{G.flags.order=true;G.star+=2;startBattle("void","final")}},
 {title:"仲間全員に決めてもらう",desc:"絆が強いほど結末が変わる",fn:()=>{G.flags.together=true;G.bond+=3;startBattle("void","final")}}
 ]);
}
function startBattle(key,mode="normal"){
 let e=enemyDefs[key];let scale=1+G.chapter*.19;let hp=Math.round(e.hp*scale),atk=Math.round(e.atk*(1+G.chapter*.08)),def=Math.round(e.def*(1+G.chapter*.07));
 if(key==="shade"&&G.chapter===0){hp=e.hp;atk=e.atk;def=e.def}
 G.battle={key,name:e.name,hp,maxHp:hp,atk,def,xp:e.xp,gold:e.gold,kind:e.kind,moves:e.moves,turn:0,rank:key==="void"?"最終":key==="memory"||key==="knight"||key==="clock"||key==="kyle"?"強敵":"通常",mode,guard:[],acted:false};
 G.stage="battle";G.party.forEach(p=>p.alive=p.hp>0);
 say("戦闘",""+e.name+"が立ちはだかった！　仲間全員のコマンドを選ぼう。");log("⚔ "+e.name+"が現れた！");
 $("mainTitle").textContent="コマンドバトル";render();
}
function renderBattleCommands(){
 const b=G.battle;if(!b)return;
 let items=[];
 if(!b.acted){
  items=[
   {title:"⚔ たたかう",desc:"ユウが攻撃",fn:()=>playerAction("attack",0)},
   {title:"✦ 星火斬り",desc:"MP 4・大ダメージ",fn:()=>playerAction("star",0)},
   {title:"✨ 癒しの光",desc:"MP 4・HPを回復",fn:()=>playerAction("heal",0)},
   {title:"🛡 全員ぼうぎょ",desc:"敵の攻撃を軽減",fn:()=>playerAction("guard",0)},
   {title:"🎒 道具",desc:"回復アイテムを使う",fn:()=>battleItemMenu()},
   {title:"🤝 仲間の連携",desc:"絆が高いほど強力",fn:()=>playerAction("bond",0)}
  ];
 }else items=[{title:"次へ",desc:"次のターンへ",fn:()=>enemyTurn()}];
 setButtons($("battleCommands"),items);
}
function playerAction(type,target){
 let b=G.battle;if(!b||b.acted)return;
 let p=G.party[0],msg="";
 if(type==="attack"){let dmg=Math.max(1,p.atk+G.weaponBonus+ rnd(5)-b.def);b.hp-=dmg;msg=`ユウの攻撃！ ${b.name}に${dmg}のダメージ！`}
 if(type==="star"){if(p.mp<4){say("ユウ","MPが足りない！");return}p.mp-=4;let dmg=Math.max(3,p.atk+p.mag+8+rnd(8)-b.def);b.hp-=dmg;msg=`星火斬り！ 星の刃が走り、${dmg}のダメージ！`}
 if(type==="heal"){if(p.mp<4){say("ユウ","MPが足りない！");return}p.mp-=4;let who=G.party.filter(x=>x.hp>0).sort((a,b)=>(a.maxHp-a.hp)-(b.maxHp-b.hp)).pop();if(!who)who=p;let amount=22+G.party[1].mag;who.hp=Math.min(who.maxHp,who.hp+amount);msg=`癒しの光！ ${who.name}のHPが${amount}回復！`}
 if(type==="guard"){b.guard=G.party.map(()=>true);msg="全員が守りの構えをとった！"}
 if(type==="bond"){let bond=G.bond+G.party.reduce((s,p)=>s+p.friend,0);if(bond<2){say("ユウ","まだ仲間との絆が足りない……。");return}let dmg=12+bond*3+rnd(10);b.hp-=dmg;G.party.forEach(p=>p.mp=Math.max(0,p.mp-1));msg=`絆の連携！ 四人の力が重なり${dmg}のダメージ！`}
 log(msg);say("戦闘ログ",msg);b.acted=true;
 if(b.hp<=0){winBattle();return}
 render();renderBattleCommands();
}
function battleItemMenu(){
 let avail=Object.entries(G.items).filter(([k,n])=>n>0&&itemsDef[k]);
 if(!avail.length){say("道具","使える道具がない。");return}
 setButtons($("battleCommands"),avail.map(([k,n])=>({title:itemsDef[k].name+" ×"+n,desc:itemsDef[k].desc,fn:()=>useItem(k,true)})).concat([{title:"戻る",desc:"コマンドに戻る",fn:()=>renderBattleCommands()}]));
}
function useItem(key,inBattle){
 if(!G.items[key])G.items[key]=0;
 let it=itemsDef[key];if(!it||G.items[key]<=0){say("道具","その道具は持っていない。");return}
 if(it.type==="weapon"||it.type==="armor"){say("道具","装備品は装備タブから購入してね。");return}
 let target;
 if(it.type==="revive")target=G.party.find(p=>p.hp<=0);
 else target=G.party.filter(p=>p.hp>0).sort((a,b)=>(a.maxHp-a.hp)-(b.maxHp-b.hp))[0];
 if(!target){say("道具","今は使えない。");return}
 if(it.type==="revive"&&!G.party.some(p=>p.hp<=0)){say("道具","戦闘不能の仲間がいない。");return}
 G.items[key]--;if(it.type==="heal")target.hp=Math.min(target.maxHp,target.hp+it.power);if(it.type==="mp")target.mp=Math.min(target.maxMp,target.mp+it.power);if(it.type==="revive")target.hp=it.power;
 let msg=`${it.name}を使った。${target.name}の${it.type==="mp"?"MP":"HP"}が回復！`;log(msg);say("道具",msg);
 if(inBattle&&G.battle){G.battle.acted=true;render();renderBattleCommands()}else{renderTab();drawParty()}
}
function enemyTurn(){
 let b=G.battle;if(!b)return;
 let alive=G.party.filter(p=>p.hp>0);if(!alive.length){G.party.forEach(p=>{p.hp=Math.max(1,Math.floor(p.maxHp*.35));p.mp=Math.max(1,Math.floor(p.maxMp*.3))});G.gold=Math.max(0,G.gold-10);G.battle=null;log("仲間たちは村の宿で目を覚ました。所持金を少し失った。");say("敗北","倒れてしまった……けれど、旅はまだ終わらない。");continueAfterBattle(false);return}
 let target=alive[rnd(alive.length)],move=b.moves[rnd(b.moves.length)],dmg=Math.max(1,b.atk+rnd(6)-target.def-G.armorBonus);
 if(b.guard&&b.guard[G.party.indexOf(target)])dmg=Math.max(1,Math.floor(dmg*.35));
 target.hp=Math.max(0,target.hp-dmg);log(`${b.name}の${move}！ ${target.name}は${dmg}のダメージ！`);
 b.turn++;b.acted=false;b.guard=[];
 if(b.key==="void"&&b.hp<b.maxHp*.5&&!b.phase2){b.phase2=true;b.atk+=5;log("虚無の王が第二形態へ！攻撃が激しくなった！")}
 say("敵のターン",`${b.name}の${move}！ ${target.name}は${dmg}のダメージを受けた。`);
 if(!G.party.some(p=>p.hp>0)){render();renderBattleCommands();setTimeout(()=>enemyTurn(),200);return}
 render();renderBattleCommands();
}
function winBattle(){
 let b=G.battle;if(!b)return;
 G.gold+=b.gold;G.party.forEach(p=>{p.xp+=b.xp;while(p.xp>=p.xpNext){p.xp-=p.xpNext;p.level++;p.xpNext=Math.round(p.xpNext*1.45);p.maxHp+=6+rnd(4);p.maxMp+=3+rnd(3);p.atk+=2;p.def+=1;p.mag+=1;p.hp=p.maxHp;p.mp=p.maxMp;log(`${p.name}はレベル${p.level}に上がった！`)}});
 G.star+=b.kind==="boss"||b.kind==="final"?1:0;G.battle=null;log(`${b.name}を倒した！ 経験値と${b.gold}Gを獲得。`);say("勝利",`${b.name}を倒した！ 経験値を獲得し、仲間たちは成長した。`);G.stage="afterBattle";render();
 setButtons($("storyChoices"),[{title:"先へ進む",desc:"物語を続ける",fn:()=>continueAfterBattle(true)}]);$("storyChoices").classList.remove("hidden");
}
function continueAfterBattle(won){
 if(G.chapter===0){G.chapter=0;chapterOneAfter();return}
 let ch=G.chapter;
 if(ch<4){let def=chapters[ch];showChoices("語り部",def.after,[
 {title:"次の章へ",desc:"旅を続ける",fn:()=>{G.chapter++;chapterGate()}},
 {title:"仲間と休む",desc:"HPとMPを回復してから進む",fn:()=>{G.party.forEach(p=>{p.hp=p.maxHp;p.mp=p.maxMp});log("仲間たちは焚き火を囲み、傷を癒した。");G.chapter++;chapterGate()}}
 ])}else finishEnding();
}
function chapterOneAfter(){
 showChoices("古老","古老「星片は七つ。だが、それを集めれば願いが叶うという話は半分だけ正しい。星は願いを叶えるのではない。願った者が何を捨てるかを映すのだ」",[
 {title:"星片を村に預ける",desc:"人々の信頼を得る",fn:()=>{G.bond++;G.flags.trustedVillage=true;G.star++;G.chapter=1;chapterGate()}},
 {title:"星片を自分で守る",desc:"星の力を少し得る",fn:()=>{G.star+=2;G.flags.keptShard=true;G.party[0].atk+=1;G.chapter=1;chapterGate()}}
 ]);
}
function finishEnding(){
 G.ending=true;G.battle=null;
 let ending;
 if(G.flags.together&&G.bond>=7){ending="絆の夜明け";say("セレネ", "セレネ「あなたたちは、誰か一人に世界の答えを背負わせなかった。だから世界は、みんなで明日を選べる」");}
 else if(G.flags.order&&G.star>=4){ending="静止した楽園";say("語り部","世界から争いも喪失も消えた。けれど、風は同じ場所で止まり、誰も新しい歌を作らなくなった。美しく、静かな世界。その扉を開く者は、まだいない。");}
 else if(G.flags.understoodKyle&&G.bond>=5){ending="赦しの星";say("カイル","「失ったものは戻らない。それでも……お前となら、失った後の世界を歩ける気がする」");}
 else if(G.star>=4){ending="星を継ぐ者";say("語り部","星は夜空へ戻り、世界は新しい歴史を歩み始めた。悲しみも喜びも、誰かが選ぶ未来の一部として。");}
 else {ending="小さな夜明け";say("語り部","星の光は戻った。しかし、世界のすべての謎が解けたわけではない。仲間たちは、次の旅で残された真実を探すと誓った。");}
 G.endingName=ending;G.stage="ending";log("物語の結末："+ending);$("mainTitle").textContent="旅の結末";$("chapterPill").textContent="終幕";$("sceneLabel").textContent=ending;pixelArt("final");
 $("storyChoices").classList.remove("hidden");setButtons($("storyChoices"),[
 {title:"エピローグを読む",desc:"旅のその後",fn:()=>showChoices("エピローグ",`【${ending}】\n\n世界は一夜で変わったわけではない。人々は少しずつ、忘れていた名前を取り戻し、明日の話をするようになった。\n\nユウたちは星を見上げる。そこにある光は、誰かが与えた正解ではない。迷いながら選んだ道の先に、自分たちで見つけた光だった。\n\n——そして、遠い空の向こうで、新しい星がひとつ瞬いた。`,[{title:"タイトルへ戻る",desc:"新しい旅を始める",fn:()=>{G=fresh();begin();render()}}])},
 {title:"最初から遊ぶ",desc:"別の選択を試す",fn:()=>{G=fresh();begin();render()}}
 ]);render();
}
function buyGear(key){
 let it=itemsDef[key];if(G.gold<it.price){say("商人","お金が足りないよ。");return}
 G.gold-=it.price;
 if(it.type==="weapon"){G.weaponBonus+=it.power;G.party[0].weapon=it.name;G.inventory.push(it.name)}
 else{G.armorBonus+=it.power;G.party[0].armor=it.name;G.inventory.push(it.name)}
 log(`${it.name}を購入した。装備が強化された！`);say("商人",`${it.name}を手に入れた！`);renderTab();drawParty()
}
function resetParty(){G.party.forEach(p=>{p.hp=p.maxHp;p.mp=p.maxMp})}
function save(){
 try{localStorage.setItem("hoshiPixelRPGSaveV2",JSON.stringify(G));say("セーブ","冒険の記録を保存した！");log("冒険をセーブした。")}
 catch(e){say("セーブ","保存できなかった。ブラウザの設定を確認してね。")}
}
function load(){
 try{let s=localStorage.getItem("hoshiPixelRPGSaveV2");if(!s){say("ロード","セーブデータが見つからない。");return}let data=JSON.parse(s);if(!data.party||!Array.isArray(data.party))throw new Error("bad save");G=data;log("セーブデータをロードした。");render();if(!G.battle)renderStoryForStage()}
 catch(e){say("ロード","データを読み込めなかった。")}
}
function renderStoryForStage(){
 if(G.ending){finishEnding();return}
 if(G.chapter===0&&G.stage==="intro")begin();
 else if(G.stage==="chapter")chapterGate();
 else if(G.stage==="village")firstScene();
 else if(G.stage==="afterBattle")continueAfterBattle(true);
 else {showChoices("旅の記録","旅は続いている。仲間たちと次の目的地を決めよう。",[{title:"物語を続ける",desc:"次の場面へ",fn:()=>G.chapter===0?chapterOneAfter():chapterGate()}])}
}
$("tabs").addEventListener("click",e=>{let b=e.target.closest("[data-tab]");if(!b)return;G.tab=b.dataset.tab;renderTab()});
$("saveBtn").addEventListener("click",save);
$("loadBtn").addEventListener("click",load);
$("resetBtn").addEventListener("click",()=>{if(confirm("今の進行をリセットして、最初から始めますか？")){G=fresh();begin();render();}});
G=fresh();begin();render();
</script>
</body>
</html>
