{title:"第三章　時を編む森",place:"エルディア樹海",intro:"樹海の奥では、昨日と明日が同じ道に重なっていた。森の守り手レイナは、何度も同じ別れを夢に見るという。旅人たちは、まだ出会っていない仲間の声を聞き、失ったはずの人の影を見た。森の中心に立つ大樹は、ユウに問いかける。『救いたい過去のために、今を捨てる覚悟はあるか』。",objective:"時の樹を守る三つの紋章を集める",boss:"逆さ時計の魔人",after:"レイナは、未来の自分が世界を滅ぼす場面を見せられる。しかし彼女は未来を拒むのではなく、選び直すと決める。星片は過去を戻す鍵ではなく、可能性を一つに縛る鎖だった。"},
{title:"第四章　空葬の城",place:"天空城ネメシア",intro:"雲海の上に眠る天空城は、世界がまだ一つだった時代の記憶を宿していた。そこで一行は、敵の将軍カイルと出会う。彼は星を奪う理由を語る。星の力で世界を一つの正しい歴史に戻せば、誰も大切な人を失わずに済むのだと。彼の言葉は、ユウ自身が心の奥で願っていたことでもあった。",objective:"天空城の四つの試練を越え、星の核へ向かう",boss:"星喰いの将軍カイル",after:"カイルの仮面の下にあったのは、ユウと同じ星の紋章だった。二人は幼い頃、同じ事故で記憶を失っていた。カイルこそ、消えた星の守護者の一人。そして星を集める声の主は、世界を壊した魔王ではなかった。"},

function playerAction(type,target){
 let b=G.battle;if(!b||b.acted)return;
 let p=G.party[0],msg="";
 if(type==="attack"){let dmg=Math.max(1,p.atk+G.weaponBonus+ rnd(5)-b.def);b.hp-=dmg;msg=`ユウの攻撃！ ${b.name}に${dmg}のダメージ！`}
 if(type==="star"){if(p.mp<4){say("ユウ","MPが足りない！");return}p.mp-=4;let dmg=Math.max(3,p.atk+p.mag+8+rnd(8)-b.def);b.hp-=dmg;msg=`星火斬り！ 星の刃が走り、${dmg}のダメージ！`}
 if(type==="heal"){if(p.mp<4){say("ユウ","MPが足りない！");return}p.mp-=4;let who=G.party.filter(x=>x.hp>0).sort((a,b)=>(a.maxHp-a.hp)-(b.maxHp-b.hp)).pop();if(!who)who=p;let amount=22+G.party[1].mag;who.hp=Math.min(who.maxHp,who.hp+amount);msg=`癒しの光！ ${who.name}のHPが${amount}回復！`}
 if(type==="guard"){b.guard=G.party.map(()=>true);msg="全員が守りの構えをとった！"}
 if(type==="bond"){let bond=G.bond+G.party.reduce((s,p)=>s+p.friend,0);if(bond<2){say("ユウ","まだ仲間との絆が足りない……。");return}let dmg=12+bond*3+rnd(10);b.hp-=dmg;G.party.forEach(p=>p.mp=Math.max(0,p.mp-1));msg=`絆の連携！ 四人の力が重なり${dmg}のダメージ！`}
 log(msg);say("戦闘ログ",msg);b.acted=true;
 if(b.hp<=0){winBattle();return}
 render();renderBattleCommands();
}

function useItem(key,inBattle){
 if(!G.items[key])G.items[key]=0;
 let it=itemsDef[key];if(!it||G.items[key]<=0){say("道具","その道具は持っていない。");return}
 if(it.type==="weapon"||it.type==="armor"){say("道具","装備品は装備タブから購入してね。");return}
 let target;
 if(it.type==="revive")target=G.party.find(p=>p.hp<=0);
 else target=G.party.filter(p=>p.hp>0).sort((a,b)=>(a.maxHp-a.hp)-(b.maxHp-b.hp))[0];
 if(!target){say("道具","今は使えない。");return}
 if(it.type==="revive"&&!G.party.some(p=>p.hp<=0)){say("道具","戦闘不能の仲間がいない。");return}
 G.items[key]--;if(it.type==="heal")target.hp=Math.min(target.maxHp,target.hp+it.power);if(it.type==="mp")target.mp=Math.min(target.maxMp,target.mp+it.power);if(it.type==="revive")target.hp=it.power;
 let msg=`${it.name}を使った。${target.name}の${it.type==="mp"?"MP":"HP"}が回復！`;log(msg);say("道具",msg);
 if(inBattle&&G.battle){G.battle.acted=true;render();renderBattleCommands()}else{renderTab();drawParty()}
}
function enemyTurn(){
 let b=G.battle;if(!b)return;
 let alive=G.party.filter(p=>p.hp>0);if(!alive.length){G.party.forEach(p=>{p.hp=Math.max(1,Math.floor(p.maxHp*.35));p.mp=Math.max(1,Math.floor(p.maxMp*.3))});G.gold=Math.max(0,G.gold-10);G.battle=null;log("仲間たちは村の宿で目を覚ました。所持金を少し失った。");say("敗北","倒れてしまった……けれど、旅はまだ終わらない。");continueAfterBattle(false);return}
 let target=alive[rnd(alive.length)],move=b.moves[rnd(b.moves.length)],dmg=Math.max(1,b.atk+rnd(6)-target.def-G.armorBonus);
 if(b.guard&&b.guard[G.party.indexOf(target)])dmg=Math.max(1,Math.floor(dmg*.35));
 target.hp=Math.max(0,target.hp-dmg);log(`${b.name}の${move}！ ${target.name}は${dmg}のダメージ！`);
 b.turn++;b.acted=false;b.guard=[];
 if(b.key==="void"&&b.hp<b.maxHp*.5&&!b.phase2){b.phase2=true;b.atk+=5;log("虚無の王が第二形態へ！攻撃が激しくなった！")}
 say("敵のターン",`${b.name}の${move}！ ${target.name}は${dmg}のダメージを受けた。`);
 if(!G.party.some(p=>p.hp>0)){render();renderBattleCommands();setTimeout(()=>enemyTurn(),200);return}
 render();renderBattleCommands();
}
function winBattle(){
 let b=G.battle;if(!b)return;
 G.gold+=b.gold;G.party.forEach(p=>{p.xp+=b.xp;while(p.xp>=p.xpNext){p.xp-=p.xpNext;p.level++;p.xpNext=Math.round(p.xpNext*1.45);p.maxHp+=6+rnd(4);p.maxMp+=3+rnd(3);p.atk+=2;p.def+=1;p.mag+=1;p.hp=p.maxHp;p.mp=p.maxMp;log(`${p.name}はレベル${p.level}に上がった！`)}});
 G.star+=b.kind==="boss"||b.kind==="final"?1:0;G.battle=null;log(`${b.name}を倒した！ 経験値と${b.gold}Gを獲得。`);say("勝利",`${b.name}を倒した！ 経験値を獲得し、仲間たちは成長した。`);G.stage="afterBattle";render();
 setButtons($("storyChoices"),[{title:"先へ進む",desc:"物語を続ける",fn:()=>continueAfterBattle(true)}]);$("storyChoices").classList.remove("hidden");
}
function continueAfterBattle(won){
 if(G.chapter===0){G.chapter=0;chapterOneAfter();return}
 let ch=G.chapter;
 if(ch<4){let def=chapters[ch];showChoices("語り部",def.after,[
 {title:"次の章へ",desc:"旅を続ける",fn:()=>{G.chapter++;chapterGate()}},
 {title:"仲間と休む",desc:"HPとMPを回復してから進む",fn:()=>{G.party.forEach(p=>{p.hp=p.maxHp;p.mp=p.maxMp});log("仲間たちは焚き火を囲み、傷を癒した。");G.chapter++;chapterGate()}}
 ])}else finishEnding();
}
function chapterOneAfter(){
 showChoices("古老","古老「星片は七つ。だが、それを集めれば願いが叶うという話は半分だけ正しい。星は願いを叶えるのではない。願った者が何を捨てるかを映すのだ」",[
 {title:"星片を村に預ける",desc:"人々の信頼を得る",fn:()=>{G.bond++;G.flags.trustedVillage=true;G.star++;G.chapter=1;chapterGate()}},
 {title:"星片を自分で守る",desc:"星の力を少し得る",fn:()=>{G.star+=2;G.flags.keptShard=true;G.party[0].atk+=1;G.chapter=1;chapterGate()}}
 ]);
}
function finishEnding(){
 G.ending=true;G.battle=null;
 let ending;
 if(G.flags.together&&G.bond>=7){ending="絆の夜明け";say("セレネ", "セレネ「あなたたちは、誰か一人に世界の答えを背負わせなかった。だから世界は、みんなで明日を選べる」");}
 else if(G.flags.order&&G.star>=4){ending="静止した楽園";say("語り部","世界から争いも喪失も消えた。けれど、風は同じ場所で止まり、誰も新しい歌を作らなくなった。美しく、静かな世界。その扉を開く者は、まだいない。");}
 else if(G.flags.understoodKyle&&G.bond>=5){ending="赦しの星";say("カイル","「失ったものは戻らない。それでも……お前となら、失った後の世界を歩ける気がする」");}
 else if(G.star>=4){ending="星を継ぐ者";say("語り部","星は夜空へ戻り、世界は新しい歴史を歩み始めた。悲しみも喜びも、誰かが選ぶ未来の一部として。");}
 else {ending="小さな夜明け";say("語り部","星の光は戻った。しかし、世界のすべての謎が解けたわけではない。仲間たちは、次の旅で残された真実を探すと誓った。");}
 G.endingName=ending;G.stage="ending";log("物語の結末："+ending);$("mainTitle").textContent="旅の結末";$("chapterPill").textContent="終幕";$("sceneLabel").textContent=ending;pixelArt("final");
 $("storyChoices").classList.remove("hidden");setButtons($("storyChoices"),[
 {title:"エピローグを読む",desc:"旅のその後",fn:()=>showChoices("エピローグ",`【${ending}】\n\n世界は一夜で変わったわけではない。人々は少しずつ、忘れていた名前を取り戻し、明日の話をするようになった。\n\nユウたちは星を見上げる。そこにある光は、誰かが与えた正解ではない。迷いながら選んだ道の先に、自分たちで見つけた光だった。\n\n——そして、遠い空の向こうで、新しい星がひとつ瞬いた。`,[{title:"タイトルへ戻る",desc:"新しい旅を始める",fn:()=>{G=fresh();begin();render()}}])},
 {title:"最初から遊ぶ",desc:"別の選択を試す",fn:()=>{G=fresh();begin();render()}}
 ]);render();
}
function buyGear(key){
 let it=itemsDef[key];if(G.gold<it.price){say("商人","お金が足りないよ。");return}
 G.gold-=it.price;
 if(it.type==="weapon"){G.weaponBonus+=it.power;G.party[0].weapon=it.name;G.inventory.push(it.name)}
 else{G.armorBonus+=it.power;G.party[0].armor=it.name;G.inventory.push(it.name)}
 log(`${it.name}を購入した。装備が強化された！`);say("商人",`${it.name}を手に入れた！`);renderTab();drawParty()
}
function resetParty(){G.party.forEach(p=>{p.hp=p.maxHp;p.mp=p.maxMp})}
function save(){
 try{localStorage.setItem("hoshiPixelRPGSaveV2",JSON.stringify(G));say("セーブ","冒険の記録を保存した！");log("冒険をセーブした。")}
 catch(e){say("セーブ","保存できなかった。ブラウザの設定を確認してね。")}
}
function load(){
 try{let s=localStorage.getItem("hoshiPixelRPGSaveV2");if(!s){say("ロード","セーブデータが見つからない。");return}let data=JSON.parse(s);if(!data.party||!Array.isArray(data.party))throw new Error("bad save");G=data;log("セーブデータをロードした。");render();if(!G.battle)renderStoryForStage()}
 catch(e){say("ロード","データを読み込めなかった。")}
}
function renderStoryForStage(){
 if(G.ending){finishEnding();return}
 if(G.chapter===0&&G.stage==="intro")begin();
 else if(G.stage==="chapter")chapterGate();
 else if(G.stage==="village")firstScene();
 else if(G.stage==="afterBattle")continueAfterBattle(true);
 else {showChoices("旅の記録","旅は続いている。仲間たちと次の目的地を決めよう。",[{title:"物語を続ける",desc:"次の場面へ",fn:()=>G.chapter===0?chapterOneAfter():chapterGate()}])}
}
$("tabs").addEventListener("click",e=>{let b=e.target.closest("[data-tab]");if(!b)return;G.tab=b.dataset.tab;renderTab()});
$("saveBtn").addEventListener("click",save);
$("loadBtn").addEventListener("click",load);
$("resetBtn").addEventListener("click",()=>{if(confirm("今の進行をリセットして、最初から始めますか？")){G=fresh();begin();render();}});
G=fresh();begin();render();
</script>
</body>
</html>
